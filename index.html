```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>MP Police Payroll System - Login</title>


<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}


/* =========================
   BODY
========================= */

body{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:
        radial-gradient(
            circle at top left,
            #1d5fa7 0%,
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #071a35,
            #102b50
        );

}


/* =========================
   CONTAINER
========================= */

.login-container{

    width:100%;

    max-width:420px;

}


/* =========================
   LOGO
========================= */

.logo-section{

    text-align:center;

    color:white;

    margin-bottom:25px;

}


.logo-box{

    width:70px;

    height:70px;

    margin:auto;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #d8e4f4
        );

    color:#0b2b52;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:30px;

    font-weight:800;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.25);

}


.logo-section h1{

    margin-top:14px;

    font-size:21px;

    letter-spacing:.5px;

}


.logo-section p{

    margin-top:5px;

    font-size:11px;

    color:#b8c9dd;

}


/* =========================
   LOGIN CARD
========================= */

.login-card{

    background:white;

    border-radius:20px;

    padding:32px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.25);

}


.login-title{

    color:#183452;

    font-size:20px;

    font-weight:700;

    margin-bottom:5px;

}


.login-subtitle{

    color:#8996a7;

    font-size:11px;

    margin-bottom:25px;

}


/* =========================
   FORM
========================= */

.form-group{

    margin-bottom:18px;

}


.form-group label{

    display:block;

    font-size:11px;

    font-weight:600;

    color:#526277;

    margin-bottom:7px;

}


.input-box{

    position:relative;

}


.input-icon{

    position:absolute;

    left:13px;

    top:50%;

    transform:translateY(-50%);

    font-size:16px;

}


.input-box input{

    width:100%;

    height:45px;

    border:1px solid #dce4ed;

    border-radius:9px;

    padding:0 42px 0 40px;

    outline:none;

    background:#f8fafc;

    color:#23344c;

    font-size:13px;

}


.input-box input:focus{

    border-color:#2773c5;

    background:white;

    box-shadow:
        0 0 0 3px
        rgba(39,115,197,.10);

}


/* =========================
   EYE
========================= */

.password-eye{

    position:absolute;

    right:13px;

    top:50%;

    transform:translateY(-50%);

    cursor:pointer;

    font-size:15px;

}


/* =========================
   LOGIN BUTTON
========================= */

.login-btn{

    width:100%;

    height:46px;

    border:0;

    border-radius:9px;

    background:
        linear-gradient(
            90deg,
            #2374d8,
            #1454a1
        );

    color:white;

    font-size:14px;

    font-weight:600;

    cursor:pointer;

    margin-top:5px;

    box-shadow:
        0 7px 18px
        rgba(20,84,161,.25);

}


.login-btn:hover{

    background:
        linear-gradient(
            90deg,
            #2b80e5,
            #155db0
        );

}


/* =========================
   ERROR MESSAGE
========================= */

.message{

    display:none;

    margin-top:15px;

    padding:10px;

    border-radius:7px;

    font-size:11px;

    text-align:center;

}


.message.show{

    display:block;

}


.message.error{

    background:#fff1f1;

    color:#d74b4b;

    border:1px solid #ffd5d5;

}


/* =========================
   FOOTER
========================= */

.footer{

    text-align:center;

    color:#9fb1c8;

    font-size:10px;

    margin-top:18px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:480px){

    body{

        padding:15px;

    }


    .login-card{

        padding:25px 20px;

    }


    .logo-box{

        width:62px;

        height:62px;

        font-size:26px;

    }


    .logo-section h1{

        font-size:19px;

    }

}

</style>

</head>


<body>


<div class="login-container">


    <!-- =========================
         LOGO
    ========================= -->

    <div class="logo-section">


        <div class="logo-box">

            MP

        </div>


        <h1>

            MP Police Payroll System

        </h1>


        <p>

            Payroll Management System

        </p>


    </div>



    <!-- =========================
         LOGIN CARD
    ========================= -->

    <div class="login-card">


        <div class="login-title">

            User Login

        </div>


        <div class="login-subtitle">

            Sign in to access the payroll dashboard

        </div>



        <!-- =========================
             LOGIN FORM
        ========================= -->

        <form id="loginForm">


            <!-- USERNAME -->

            <div class="form-group">


                <label>

                    USERNAME

                </label>


                <div class="input-box">


                    <span class="input-icon">

                        👤

                    </span>


                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >


                </div>


            </div>



            <!-- PASSWORD -->

            <div class="form-group">


                <label>

                    PASSWORD

                </label>


                <div class="input-box">


                    <span class="input-icon">

                        🔒

                    </span>


                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >


                    <span
                        class="password-eye"
                        id="eye"
                        onclick="togglePassword()">

                        👁

                    </span>


                </div>


            </div>



            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-btn">

                LOGIN

            </button>



            <!-- MESSAGE -->

            <div
                id="message"
                class="message">

            </div>


        </form>


    </div>



    <!-- FOOTER -->

    <div class="footer">

        MP Police Payroll System © 2026

    </div>


</div>



<script>

/* ==================================================
   SHOW / HIDE PASSWORD
================================================== */

function togglePassword(){

    const password =
        document.getElementById("password");

    const eye =
        document.getElementById("eye");


    if(password.type === "password"){

        password.type = "text";

        eye.textContent = "🙈";

    }

    else{

        password.type = "password";

        eye.textContent = "👁";

    }

}



/* ==================================================
   LOGIN
================================================== */

document
.getElementById("loginForm")
.addEventListener("submit", function(event){

    /*
       Browser ka default form submit
       rok rahe hain.
    */

    event.preventDefault();


    /* USERNAME */

    const username =
        document
        .getElementById("username")
        .value
        .trim();


    /* PASSWORD */

    const password =
        document
        .getElementById("password")
        .value;


    /* MESSAGE */

    const message =
        document
        .getElementById("message");



    /* ==================================================
       LOGIN DETAILS
    ================================================== */

    if(
        username === "admin" &&
        password === "1234"
    ){


        /* LOGIN SUCCESS */

        sessionStorage.setItem(
            "payrollLogin",
            "true"
        );


        sessionStorage.setItem(
            "payrollUser",
            username
        );


        /*
           Dashboard open
        */

        window.location.assign(
            "dashboard.html"
        );


    }

    else{


        /* WRONG LOGIN */

        message.textContent =
            "Invalid username or password";


        message.className =
            "message show error";


    }

});

</script>


</body>

</html>
```
